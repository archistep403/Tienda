<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<title>StoreGo | Panel admin</title>
</head>
<body>
	<nav class="menu">
		<a href="index.html" class="elemento">Inicio</a>
		<a href="productos.html" class="elemento">Productos</a>
		<a href="contacto.html" class="elemento">Contacto</a>
		<a href="login.html" class="elemento" id="navAuthLink">Ingresar</a>
		<a href="admin.html" class="elemento" id="navAdminLink" style="display:none;">Admin</a>
		<a href="carrito.html" class="carrito">🛒<span id="cartBadge" class="cart-badge"></span></a>
	</nav>

	<div class="admin-wrap">
		<h1>Panel administrativo</h1>
		<p class="subtitle">Agrega, edita o elimina productos del catálogo.</p>

		<div class="admin-grid">
			<div class="form-card">
				<h1 style="font-size:18px;" id="formTitle">Nuevo producto</h1>
				<p class="form-msg error" id="productError"></p>
				<form id="productForm">
					<input type="hidden" id="pId" value="">
					<div class="campo">
						<label for="pName">Nombre</label>
						<input type="text" id="pName" required>
					</div>
					<div class="campo">
						<label for="pPrice">Precio (CLP)</label>
						<input type="number" id="pPrice" min="0" step="1" required>
					</div>
					<div class="campo">
						<label for="pStock">Stock</label>
						<input type="number" id="pStock" min="0" step="1" value="1" required>
					</div>
					<div class="campo">
						<label for="pSpec">Detalle (ej. capacidad)</label>
						<input type="text" id="pSpec">
					</div>
					<div class="campo">
						<label for="pImageFile">Foto del producto</label>
						<input type="file" id="pImageFile" accept="image/*">
						<img id="pImagePreview" alt="Vista previa" style="display:none; max-width:100%; margin-top:8px; border-radius:5px; border:1px solid #E2E8F0;">
						<button type="button" id="removeImageBtn" class="remove-link" style="display:none; margin-top:6px;">Quitar imagen</button>
						<p class="demo-hint" style="margin-top:6px; text-align:left;">Se guarda en el navegador: usa fotos livianas (idealmente menos de 500 KB).</p>
					</div>
					<div class="campo">
						<label for="pImage">O pega una URL de imagen</label>
						<input type="text" id="pImage" placeholder="img/producto.jpg">
					</div>
					<button type="submit" class="form-btn" id="submitBtn">Agregar producto</button>
					<button type="button" class="form-btn" id="cancelEditBtn" style="display:none; background-color:#888; margin-top:8px;">Cancelar edición</button>
				</form>
			</div>

			<div class="admin-table-wrap">
				<table class="admin-table">
					<thead>
						<tr>
							<th></th>
							<th>Producto</th>
							<th>Precio</th>
							<th>Stock</th>
							<th></th>
						</tr>
					</thead>
					<tbody id="productTableBody"></tbody>
				</table>
			</div>
		</div>
	</div>

	<footer class="pie">
		<p>© 2026 StoreGo. Proyecto educativo.</p>
	</footer>

	<script src="js/data.js"></script>
	<script src="js/auth.js"></script>
	<script src="js/cart.js"></script>
	<script src="js/nav.js"></script>
	<script>
		if (!Auth.requireAdmin()) {
			// requireAdmin ya redirige a login.html si no corresponde
			throw new Error('Acceso restringido');
		}

		let uploadedImageData = null;
		const fileInput = document.getElementById('pImageFile');
		const previewImg = document.getElementById('pImagePreview');
		const removeImageBtn = document.getElementById('removeImageBtn');
		const urlInput = document.getElementById('pImage');

		function mostrarPreview(src) {
			previewImg.src = src;
			previewImg.style.display = 'block';
			removeImageBtn.style.display = 'inline-block';
		}

		function limpiarImagenSubida() {
			uploadedImageData = null;
			fileInput.value = '';
			previewImg.style.display = 'none';
			previewImg.src = '';
			removeImageBtn.style.display = 'none';
		}

		fileInput.addEventListener('change', () => {
			const file = fileInput.files[0];
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => {
				uploadedImageData = reader.result;
				mostrarPreview(uploadedImageData);
				urlInput.value = '';
			};
			reader.readAsDataURL(file);
		});

		removeImageBtn.addEventListener('click', limpiarImagenSubida);

		function renderTabla() {
			const body = document.getElementById('productTableBody');
			const productos = DB.getProducts();
			if (productos.length === 0) {
				body.innerHTML = '<tr><td colspan="5">Sin productos publicados.</td></tr>';
				return;
			}
			body.innerHTML = productos.map(p => `
				<tr>
					<td><img src="${p.image}" alt="${p.name}" style="width:44px; height:44px; object-fit:cover; border-radius:4px;"></td>
					<td>${p.name}</td>
					<td>${formatCLP(p.price)}</td>
					<td>${p.stock}</td>
					<td>
					<button class="delete-btn" onclick="editarProducto('${p.id}')" style="color:#2563EB; margin-right:10px;">Editar</button>
					<button class="delete-btn" onclick="eliminarProducto('${p.id}')">Eliminar</button>
				</td>
				</tr>
			`).join('');
		}

		function eliminarProducto(id) {
			DB.deleteProduct(id);
			if (document.getElementById('pId').value === id) {
				salirModoEdicion();
			}
			renderTabla();
		}

		function editarProducto(id) {
			const producto = DB.getProducts().find(p => p.id === id);
			if (!producto) return;
			document.getElementById('pId').value = producto.id;
			document.getElementById('pName').value = producto.name;
			document.getElementById('pPrice').value = producto.price;
			document.getElementById('pStock').value = producto.stock;
			document.getElementById('pSpec').value = producto.spec || '';

			limpiarImagenSubida();
			if (producto.image && producto.image.startsWith('data:')) {
				uploadedImageData = producto.image;
				mostrarPreview(producto.image);
				urlInput.value = '';
			} else {
				urlInput.value = producto.image || '';
			}

			document.getElementById('formTitle').textContent = 'Editar producto';
			document.getElementById('submitBtn').textContent = 'Guardar cambios';
			document.getElementById('cancelEditBtn').style.display = 'block';
			document.getElementById('productError').classList.remove('show');

			window.scrollTo({ top: 0, behavior: 'smooth' });
		}

		function salirModoEdicion() {
			document.getElementById('productForm').reset();
			document.getElementById('pId').value = '';
			document.getElementById('pStock').value = 1;
			limpiarImagenSubida();
			document.getElementById('formTitle').textContent = 'Nuevo producto';
			document.getElementById('submitBtn').textContent = 'Agregar producto';
			document.getElementById('cancelEditBtn').style.display = 'none';
		}

		document.getElementById('cancelEditBtn').addEventListener('click', salirModoEdicion);

		document.getElementById('productForm').addEventListener('submit', (e) => {
			e.preventDefault();
			const id = document.getElementById('pId').value;
			const name = document.getElementById('pName').value.trim();
			const price = Number(document.getElementById('pPrice').value);
			const stock = Number(document.getElementById('pStock').value);
			const spec = document.getElementById('pSpec').value.trim();
			const image = uploadedImageData || urlInput.value.trim();
			const errorEl = document.getElementById('productError');

			if (!name || !image || price < 0 || stock < 0) {
				errorEl.textContent = 'Revisa los datos del producto (falta nombre, precio, stock o imagen).';
				errorEl.classList.add('show');
				return;
			}
			errorEl.classList.remove('show');

			if (id) {
				DB.updateProduct(id, { name, price, stock, spec, image });
			} else {
				DB.addProduct({ id: 'p' + Date.now(), name, price, stock, spec, image });
			}

			salirModoEdicion();
			renderTabla();
		});

		renderTabla();
	</script>
</body>
</html>
